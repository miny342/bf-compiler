[package]
name = "bf-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "bf_compiler"
path = "src/lib.rs"

[dependencies]
bf-profiling = { path = "../bf-profiling" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "bfc"
path = "src/main.rs"

[dev-dependencies]
bf-interpreter = { path = "../bf-interpreter" }
